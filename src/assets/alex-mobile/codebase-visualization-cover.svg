<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Codebase visualization graph</title>
  <desc id="desc">A network diagram connecting routes, services, modules, tests, and data stores.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#09090b"/>
      <stop offset="1" stop-color="#18181b"/>
    </linearGradient>
    <radialGradient id="glow">
      <stop stop-color="#a3e635" stop-opacity=".25"/>
      <stop offset="1" stop-color="#a3e635" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow"><feDropShadow dx="0" dy="14" stdDeviation="20" flood-opacity=".35"/></filter>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
  <circle cx="800" cy="440" r="430" fill="url(#glow)"/>
  <g stroke="#71717a" stroke-width="3" stroke-opacity=".65" fill="none">
    <path d="M300 230 590 360 810 210 1040 350 1310 230"/>
    <path d="M300 230 410 610 760 660 1040 350 1180 650"/>
    <path d="M590 360 760 660M590 360 1040 350M810 210 760 660M1040 350 1310 230M1040 350 1180 650"/>
  </g>
  <g fill="#a3e635">
    <circle cx="300" cy="230" r="9"/><circle cx="590" cy="360" r="9"/><circle cx="810" cy="210" r="9"/>
    <circle cx="1040" cy="350" r="9"/><circle cx="1310" cy="230" r="9"/><circle cx="410" cy="610" r="9"/>
    <circle cx="760" cy="660" r="9"/><circle cx="1180" cy="650" r="9"/>
  </g>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="25" filter="url(#shadow)">
    <g transform="translate(190 150)"><rect width="220" height="72" rx="18" fill="#27272a" stroke="#52525b"/><text x="110" y="45" fill="#fafafa" text-anchor="middle">HTTP routes</text></g>
    <g transform="translate(470 385)"><rect width="240" height="72" rx="18" fill="#27272a" stroke="#52525b"/><text x="120" y="45" fill="#fafafa" text-anchor="middle">Auth service</text></g>
    <g transform="translate(680 120)"><rect width="260" height="72" rx="18" fill="#365314" stroke="#84cc16"/><text x="130" y="45" fill="#ecfccb" text-anchor="middle">Code graph</text></g>
    <g transform="translate(930 385)"><rect width="230" height="72" rx="18" fill="#27272a" stroke="#52525b"/><text x="115" y="45" fill="#fafafa" text-anchor="middle">Billing module</text></g>
    <g transform="translate(1210 150)"><rect width="210" height="72" rx="18" fill="#27272a" stroke="#52525b"/><text x="105" y="45" fill="#fafafa" text-anchor="middle">Event bus</text></g>
    <g transform="translate(300 640)"><rect width="220" height="72" rx="18" fill="#27272a" stroke="#52525b"/><text x="110" y="45" fill="#fafafa" text-anchor="middle">Test suite</text></g>
    <g transform="translate(650 690)"><rect width="230" height="72" rx="18" fill="#27272a" stroke="#52525b"/><text x="115" y="45" fill="#fafafa" text-anchor="middle">Shared types</text></g>
    <g transform="translate(1070 690)"><rect width="230" height="72" rx="18" fill="#27272a" stroke="#52525b"/><text x="115" y="45" fill="#fafafa" text-anchor="middle">Data store</text></g>
  </g>
  <text x="80" y="830" fill="#d4d4d8" font-family="ui-sans-serif, system-ui" font-size="30" font-weight="600">MAP THE RELATIONSHIPS, NOT JUST THE FILES</text>
</svg>
